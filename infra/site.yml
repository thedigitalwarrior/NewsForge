---
# Playbook principale: base -> node -> caddy -> deploy, verificati su `local`.
# Multi-sito: i ruoli caddy e deploy ciclano sulla lista `sites` (group_vars),
# quindi aggiungere un sito è una voce di dati, non codice nuovo.
- name: Provisioning della rete NewsForge
  hosts: local
  become: true
  roles:
    - base
    - node
    - caddy
    - deploy
